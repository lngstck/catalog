version: "1.0"
apps:
  - id: postgres
    name: Datenbank (PostgreSQL)
    category: infrastructure
    description: Speichert die Daten aller Apps
  - id: dex
    name: Anmeldung (Dex)
    category: infrastructure
    description: Anmeldung mit dem Schulkonto für alle Apps
  - id: caddy
    name: Webzugang (Caddy)
    category: infrastructure
    description: Holt die Zertifikate und leitet Login und Apps an ihre Adressen
  - id: llmd
    name: KI-Dienst (llmd)
    category: infrastructure
    description: Verbindet Apps mit KI-Anbietern, mit Modellen und Prompts der Schule
  - id: open-webui
    name: Open WebUI
    category: education
    description: KI-Chat für Lehrkräfte und Schüler:innen
  - id: pylearn
    name: PyLearn
    category: education
    description: KI-gestützte Python-Lernumgebung mit Pyodide, ACE-Editor und Lehrer-Dashboard
  - id: sponsorenlauf
    name: Sponsorenlauf
    category: education
    description: Sponsorenlauf-Verwaltung mit RFID-Rundenzählung und Sponsor-Selbsteintragung
  - id: handheld
    name: Handheld
    category: education
    description: CircuitPython-Editor für die schulische ESP32-Handheld-Konsole, mit Projektablage und Lehrer-Leseansicht
  - id: roberta
    name: Open Roberta Lab
    category: education
    description: Grafisch programmieren mit NEPO-Blöcken für Calliope, micro:bit, LEGO, Arduino und mehr

global_env_schema:
  - key: LLM_API_KEY
    description: Schlüssel für den KI-Dienst (setzt stackctl bei dessen Installation)
    required: false
