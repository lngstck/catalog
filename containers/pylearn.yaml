id: pylearn
name: PyLearn
version: "0.8.0"
description: KI-gestützte Python-Lernumgebung mit Pyodide, ACE-Editor und Lehrer-Dashboard
category: education

links:
  homepage: https://github.com/lngstck/learningstack

image:
  name: ghcr.io/lngstck/pylearn
  tag: "0.8.0"

ports:
  - host: 8330
    container: 8000
    description: Web UI

volumes:
  - host: /opt/learningstack/pylearn/data
    container: /data
    owner: "10100:10100"

depends_on:
  - postgres
  - dex
  - llmd

oidc:
  client_id: pylearn
  redirect_path: /auth/callback

secrets:
  - key: PYLEARN_OIDC_SECRET
    generate: secret
  - key: PYLEARN_DB_PASSWORD
    generate: password
  - key: PYLEARN_SESSION_SECRET
    generate: secret

environment:
  # OIDC via lokaler Dex
  - key: OIDC_ISSUER
    value: "${DEX_AUTH_URL}"
  - key: OIDC_CLIENT_ID
    value: "pylearn"
  - key: OIDC_CLIENT_SECRET
    value: "${PYLEARN_OIDC_SECRET}"
  # Die Redirect-URI kommt von stackctl: dieselbe Zeichenkette wird in Dex
  # registriert, und sie hängt an der Betriebsart der Schule. Hier selbst
  # gebaut wäre sie für jede Schule mit eigener Domain falsch.
  - key: OIDC_REDIRECT_URI
    value: "${PYLEARN_OIDC_REDIRECT_URI}"
  # Rollen-Defaults entsprechen den moin.schule-Konventionen (Lehr/Lern/Leit).
  # Operator kann pro Schule via stackctl set überschreiben.
  - key: OAUTH_TEACHER_ROLES
    value: "Lehr,Leit"
  - key: OAUTH_STUDENT_ROLES
    value: "Lern"
  # Session-Cookie nur über HTTPS (TLS terminiert der lokale Reverse-Proxy).
  - key: PYLEARN_SECURE_COOKIES
    value: "true"
  # KI-Anfragen pro Schüler:in (0 = aus). Schützt vor Token-Kosten.
  - key: PYLEARN_AI_RATE_LIMIT_HOUR
    value: "60"
  - key: PYLEARN_AI_RATE_LIMIT_DAY
    value: "300"
  # PostgreSQL — eigene DB, von stackctl angelegt
  - key: DATABASE_URL
    value: "postgresql+psycopg://pylearn:${PYLEARN_DB_PASSWORD}@ls-postgres:5432/pylearn"
  # LLM via llmd-Gateway
  - key: OPENAI_API_BASE_URL
    value: "http://ls-llmd:8000/v1"
  - key: OPENAI_API_KEY
    value: "${LLM_API_KEY}"
  # Session
  - key: SESSION_SECRET
    value: "${PYLEARN_SESSION_SECRET}"
  # App-Konfig
  - key: SCHOOL_NAME
    value: "${SCHOOL_NAME}"
  - key: APP_NAME
    value: "PyLearn"
  - key: DATA_DIR
    value: "/data"

global_env:
  - key: SCHOOL_NAME
    description: Schulname (für Anzeige in der App)
    required: false
  - key: SCHOOL_SLUG
    description: URL-sicherer Schulkürzel
    required: false
  - key: DEX_AUTH_URL
    description: Dex-OIDC-Base-URL
    required: false
  - key: LLM_API_KEY
    description: API-Key für den lokalen llmd-Gateway
    required: true

post_install:
  messages:
    - "PyLearn: {public_app_url}"
    - "Erste Schritte: als Lehrkraft anmelden, unter {public_app_url}/admin/llm-config eine Persona wählen, dann Lerngruppen anlegen."
  secrets_to_show:
    - key: PYLEARN_OIDC_SECRET
      label: OIDC-Secret
    - key: PYLEARN_SESSION_SECRET
      label: Session-Secret
