id: llmd
name: KI-Dienst (llmd)
version: "0.2.0"
description: Verbindet Apps mit KI-Anbietern, mit Modellen und Prompts der Schule
category: infrastructure

links:
  homepage: https://github.com/lngstck/llmd

image:
  name: ghcr.io/lngstck/llmd
  tag: "0.2.0"

ports:
  - host: 8320
    container: 8000
    description: API (OpenAI-kompatibel)

volumes:
  # llmd liest config.yaml aus /etc/llmd. stackctl schreibt sie direkt in
  # das Host-Verzeichnis und schickt SIGHUP für Reload. Schema v2 inlined
  # Provider-Keys und Persona-Prompts in dieser einen Datei.
  # Read-only Mount, daher KEIN owner: — stackctl-User muss schreiben können,
  # 0o755/0o644 (von paths.EnsureDir/AtomicWrite gesetzt) reicht dem 1001-User
  # zum Lesen.
  - host: /opt/learningstack/llmd/config
    container: /etc/llmd
    readonly: true

depends_on: []

# Bewusst KEIN oidc:-Block — llmd kennt keine User. Zugriffskontrolle
# läuft per API-Key (bcrypt-gehasht in config.yaml). Die anrufende App
# (Open WebUI etc.) macht ggf. eigene Per-Group-Permissions.
#
# Bewusst KEIN environment:-Block — die gesamte Konfiguration inkl.
# Provider-API-Keys lebt seit Schema v2 in /etc/llmd/config.yaml, von
# stackctl gepflegt. Kein PROVIDER_*_KEY in .env mehr.

post_install:
  messages:
    - "Der KI-Dienst läuft. Apps aus dem Katalog sprechen ihn direkt an."
    - "Nächster Schritt in stackctl unter „KI“: einen Anbieter eintragen, etwa OpenAI oder ein Ollama im Schulnetz, und den Modellen zuweisen."
    - "Zwei Beispiel-Modelle mit eigenem System-Prompt sind schon angelegt: grundschul-erklaerer und sek2-helfer."
