id: handheld
name: Handheld
version: "0.1.0-1"
description: CircuitPython-Editor für die schulische ESP32-Handheld-Konsole, mit Projektablage und Lehrer-Leseansicht
category: education

links:
  homepage: https://github.com/lngstck/handheld

admin_info:
  notes: |
    Die App hat kein separates Admin-UI — Lehrkräfte und Schüler:innen
    melden sich per Schullogin (OIDC) an, die Rolle kommt aus den
    groups-Claims. Lehrkräfte sehen unter /lehrer alle Schüler:innen der
    Instanz mit ihren Projekten (schreibgeschützt, kein Klassen-/Kursmodell).

    WICHTIG — Web Serial: Der Editor spricht das Board per USB über die
    Web-Serial-API an. Die braucht einen Secure Context, funktioniert also
    NUR über die HTTPS-Adresse der App.
    Client-Anforderungen: Chrome/Edge (kein Firefox/Safari) und Zugriff auf
    den USB-Port des Schul-PCs.

image:
  name: ghcr.io/lngstck/handheld
  tag: "0.1.0"

ports:
  - host: 8350          # stackweit eindeutig (open-webui 8310, llmd 8320, pylearn 8330, sponsorenlauf 8340)
    container: 8000
    description: Web-UI (Editor + Projekte); Web Serial nur über die HTTPS-Adresse

# Kein Volume: Projekte, Dateien und Snapshots liegen komplett in Postgres.
# Der Editor-Build ist Teil des Images. Updates sind damit zustandslos.

depends_on:
  - postgres
  - dex
  # Kein llmd: der KI-Chat kommt erst in einer späteren Phase, dann als
  # optionale Dependency mit graceful degradation.

oidc:
  client_id: handheld
  redirect_path: /auth/callback

secrets:
  - key: HANDHELD_OIDC_SECRET
    generate: secret
  - key: HANDHELD_DB_PASSWORD
    generate: password
  - key: HANDHELD_SESSION_SECRET
    generate: secret

environment:
  # --- OIDC (Login für Lehrkräfte und Schüler:innen) ---
  - key: OIDC_ISSUER
    value: "${DEX_AUTH_URL}"
  - key: OIDC_CLIENT_ID
    value: "handheld"
  - key: OIDC_CLIENT_SECRET
    value: "${HANDHELD_OIDC_SECRET}"
  # Von stackctl gesetzt — identisch mit der Registrierung in Dex.
  - key: OIDC_REDIRECT_URI
    value: "${HANDHELD_OIDC_REDIRECT_URI}"
  # Welche groups-Werte Lehrkraft und Schüler:in bedeuten, schreibt stackctl
  # in die .env (Claim-Kontrakt): bei den Testkonten lehrkraft/schueler,
  # später die Werte des Anmeldedienstes der Schule.
  - key: OAUTH_TEACHER_ROLES
    value: "${ROLE_TEACHER_GROUPS}"
  - key: OAUTH_STUDENT_ROLES
    value: "${ROLE_STUDENT_GROUPS}"
  # --- Datenbank ---
  - key: DATABASE_URL
    value: "postgresql+psycopg://handheld:${HANDHELD_DB_PASSWORD}@ls-postgres:5432/handheld"
  # --- Session / Sicherheit ---
  - key: SESSION_SECRET
    value: "${HANDHELD_SESSION_SECRET}"
  # Session-Cookie nur über HTTPS (TLS terminiert der lokale Reverse-Proxy).
  - key: HANDHELD_SECURE_COOKIES
    value: "true"
  # HANDHELD_DEV_LOGIN wird absichtlich NICHT gesetzt — der Dev-Login-Bypass
  # ist ausschließlich für die lokale compose.dev und ist ohne die Variable
  # deaktiviert.
  # --- Anzeige ---
  - key: APP_NAME
    value: "Handheld"
  - key: SCHOOL_NAME
    value: "${SCHOOL_NAME}"
  - key: SCHOOL_SLUG
    value: "${SCHOOL_SLUG}"

global_env:
  - key: SCHOOL_NAME
    description: Schulname (Anzeige)
    required: false
  - key: SCHOOL_SLUG
    description: URL-sicherer Schulkürzel
    required: false
  - key: DEX_AUTH_URL
    description: Dex-OIDC-Base-URL
    required: false

post_install:
  messages:
    - "Handheld: {public_app_url} (Web Serial braucht HTTPS, also genau diese Adresse)"
    - "Erste Schritte: Als Lehrkraft anmelden (Übersicht unter /lehrer), Schüler:innen legen unter /projekte ihr erstes Projekt an und öffnen es im Editor."
    - "Am Schul-PC: Chrome oder Edge, Board per USB anstecken, im Editor auf Verbinden — CircuitPython muss auf dem Board laufen."
