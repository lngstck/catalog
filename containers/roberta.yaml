id: roberta
name: Open Roberta Lab
version: "1.0"
description: Grafisch programmieren mit NEPO-Blöcken für Calliope, micro:bit, LEGO, Arduino und mehr
category: education

links:
  homepage: https://www.open-roberta.org
  docs: https://github.com/OpenRoberta/openroberta-lab/wiki

admin_info:
  notes: |
    Kein Schullogin: Open Roberta kennt kein OIDC und fuehrt eigene Konten.
    Programmieren und auf den Roboter uebertragen geht ohne Anmeldung, die
    Programme lassen sich dann als Datei exportieren. Wer auf dem Server
    speichern will, legt dort ein Konto an; Lehrkraefte koennen darunter
    Gruppen mit Schuelerkonten erzeugen. E-Mail ist dafuer nicht noetig.

# Das offizielle Einzel-Image: Server, Weboberflaeche und alle Crosscompiler
# in einem Container, rund 1 GB. Gibt es nur fuer amd64.
image:
  name: openroberta/standalone
  tag: "5.2.32"

ports:
  - host: 8360
    container: 1999
    description: Web UI

# Die Datenbank (HSQLDB) laeuft eingebettet im Server und liegt als Datei in
# /opt/db. Ist der Ordner beim Start leer, legt das Image eine neue an.
#
# /tmp/openrobertaTmp (Build-Ausgaben der Crosscompiler) wird bewusst NICHT
# nach /opt/learningstack gelegt: alles dort landet in jeder Sicherung. Das
# Image deklariert den Pfad als Volume, Docker haelt ihn deshalb selbst.
volumes:
  - host: /opt/learningstack/roberta/db
    container: /opt/db

depends_on: []

# Welche Roboter zur Auswahl stehen, liesse sich per command einschraenken
# (start.sh reicht die Argumente an den Server durch), z. B.
#   command: ["-d", "robot.whitelist=calliopev3,microbitv2,spike,ev3lejosv1"]
# Ohne Angabe sind alle Roboter-Plugins aktiv.

post_install:
  messages:
    - "Open Roberta Lab: {public_app_url}"
    - "Ohne Anmeldung sofort nutzbar. Kein Schullogin: Wer Programme auf dem Server speichern will, legt im Lab ein eigenes Konto an; Lehrkräfte können darunter Gruppen mit Schülerkonten erzeugen."
