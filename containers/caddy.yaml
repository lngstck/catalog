id: caddy
name: Reverse-Proxy (Caddy)
version: "1.1"
description: TLS-Terminierung und Hostname-Routing für Login und Apps
category: infrastructure

links:
  homepage: https://caddyserver.com

admin_info:
  notes: |
    Caddy hält Port 80 und 443, terminiert TLS und leitet anhand des
    Hostnamens an die passende App weiter: {public_app_url} und alle
    anderen Adressen unter {public_base_domain}.

    Zertifikate:
    - Nur im Schulnetz: ein Wildcard-Zertifikat für *.{public_base_domain}
      über DNS-01 bei deSEC. Die Zertifizierungsstelle erreicht den Server
      dabei nie; Voraussetzung ist der CNAME für
      _acme-challenge.{public_base_domain}.
    - Direkter Betrieb: je Adresse ein Zertifikat über HTTP-01. Port 80
      muss dauerhaft aus dem Internet erreichbar sein, sonst scheitert die
      Erneuerung still, bis das Zertifikat abläuft.

    Die Konfiguration (/etc/caddy/Caddyfile) erzeugt stackctl vollständig
    selbst und lädt sie bei jeder Änderung neu. Nicht von Hand editieren —
    die Datei wird überschrieben.

# Offizielles Caddy plus deSEC-Modul für DNS-01, gebaut aus
# images/caddy/Dockerfile in diesem Repo.
image:
  name: ghcr.io/lngstck/caddy
  tag: "2.11.7-desec1.1.0"

# Dieser Container IST der Zugang zu Login und Apps. Seine Ports bleiben
# deshalb auf 0.0.0.0, auch wenn stackctl alle übrigen Apps auf 127.0.0.1
# bindet.
public_entrypoint: true

ports:
  - host: 80
    container: 80
    description: HTTP (Weiterleitung auf HTTPS + ACME-Challenge)
  - host: 443
    container: 443
    description: HTTPS

# API-Token für deSEC (nur Betrieb im Schulnetz). stackctl schreibt ihn in die
# .env; im Caddyfile steht nur der Verweis {env.DESEC_TOKEN}, denn die Datei
# ist für alle lesbar.
environment:
  - key: DESEC_TOKEN
    value: "${DESEC_TOKEN}"

volumes:
  # Zertifikate und der ACME-Account. Gehört unbedingt ins Backup: ohne
  # diese Daten holt Caddy nach einer Wiederherstellung neue Zertifikate,
  # und Let's Encrypt erlaubt nur fünf gleiche pro Woche.
  - host: /opt/learningstack/caddy/data
    container: /data
  - host: /opt/learningstack/caddy/state
    container: /config
  # Von stackctl generierte Konfiguration.
  - host: /opt/learningstack/caddy/config
    container: /etc/caddy
    readonly: true

command:
  - caddy
  - run
  - --config
  - /etc/caddy/Caddyfile
  - --adapter
  - caddyfile

post_install:
  messages:
    - "Caddy läuft. Die Zertifikate holt er beim ersten Aufruf einer Adresse automatisch."
    - "Voraussetzung: *.{public_base_domain} zeigt im DNS auf diesen Server."
    - "Die Konfiguration erzeugt stackctl selbst — /etc/caddy/Caddyfile nicht von Hand ändern."
